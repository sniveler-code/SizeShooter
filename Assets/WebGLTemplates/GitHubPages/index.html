<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b0b0f">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0b0f'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%235ad1ff'/%3E%3C/svg%3E">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0b0f;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #unity-container {
        position: fixed;
        inset: 0;
      }
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #0b0b0f;
        outline: none;
      }
      #unity-loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: system-ui, -apple-system, sans-serif;
        color: #cfd3e1;
        font-size: 15px;
        letter-spacing: 0.06em;
      }
      #unity-progress {
        width: 60%;
        max-width: 320px;
        height: 4px;
        border-radius: 2px;
        background: #23252e;
        overflow: hidden;
      }
      #unity-progress-fill {
        width: 0%;
        height: 100%;
        background: #5ad1ff;
        transition: width 0.15s linear;
      }
      #unity-warning {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        display: none;
      }
      #unity-warning div {
        padding: 8px 12px;
        background: #2a2d3a;
        color: #ffd166;
      }
      #unity-warning div.error {
        background: #7a1d1d;
        color: #fff;
      }
      #unity-enterfull {
        position: absolute;
        right: 10px;
        bottom: 10px;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #3a3f52;
        background: rgba(20, 22, 30, 0.7);
        color: #cfd3e1;
        font: 12px system-ui, sans-serif;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
      <div id="unity-loading">
        <div>LOADING {{{ PRODUCT_NAME }}}</div>
        <div id="unity-progress"><div id="unity-progress-fill"></div></div>
      </div>
      <div id="unity-warning"></div>
      <button id="unity-enterfull">⛶</button>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#unity-loading");
      var fill = document.querySelector("#unity-progress-fill");
      var fullBtn = document.querySelector("#unity-enterfull");

      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#unity-warning");
        var div = document.createElement("div");
        div.innerHTML = msg;
        if (type === "error") div.className = "error";
        banner.appendChild(div);
        banner.style.display = "block";
        if (type !== "error") {
          setTimeout(function () {
            if (div.parentNode) div.parentNode.removeChild(div);
            banner.style.display = banner.children.length ? "block" : "none";
          }, 5000);
        }
      }

      var config = {
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ PRODUCT_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        matchWebGLToCanvasSize: true
      };

      function openFullscreen() {
        var el = document.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
        if (req) req.call(el).catch(function () {});
      }

      var isMobile = window.matchMedia("(pointer: coarse)").matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isMobile) fullBtn.style.display = "block";

      fullBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        if (window.unityInstance) window.unityInstance.SetFullscreen(1);
        else openFullscreen();
      });

      var script = document.createElement("script");
      script.src = "Build/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = (100 * progress) + "%";
        }).then(function (instance) {
          loading.style.display = "none";
          window.unityInstance = instance;
        }).catch(function (message) {
          loading.style.display = "none";
          unityShowBanner(String(message), "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
